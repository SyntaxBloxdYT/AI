<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Browser Transformer LLM Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      padding: 14px 20px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: space-between;
      align-items: center;
    }
    header h1 { font-size: 1.05rem; }
    .controls { display: flex; gap: 8px; align-items: center; }
    select, button {
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 0.85rem;
      cursor: pointer;
    }
    #load-btn { background: #2563eb; border: none; font-weight: bold; }
    #load-btn:disabled { background: #475569; cursor: not-allowed; }
    #progress-container {
      width: 100%;
      background: #1e293b;
      padding: 12px 20px;
      border-bottom: 1px solid #334155;
    }
    #progress-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: #38bdf8;
      margin-bottom: 6px;
    }
    .bar-bg {
      width: 100%;
      height: 12px;
      background: #0f172a;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid #475569;
    }
    #bar-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #2563eb, #38bdf8);
      transition: width 0.2s ease;
    }
    #chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .user { align-self: flex-end; background: #2563eb; color: #fff; }
    .assistant { align-self: flex-start; background: #1e293b; border: 1px solid #334155; }
    .cursor::after {
      content: "▋";
      animation: blink 0.8s infinite;
      margin-left: 2px;
      color: #38bdf8;
    }
    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }
    #input-area {
      display: flex;
      gap: 10px;
      padding: 16px 20px;
      background: #1e293b;
      border-top: 1px solid #334155;
    }
    #user-input {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 1rem;
    }
    #send-btn {
      padding: 0 20px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }
    #send-btn:disabled { background: #475569; cursor: not-allowed; }
  </style>
</head>
<body>
  <header>
    <h1>Browser Transformer LLM</h1>
    <div class="controls">
      <select id="model-select">
        <option value="onnx-community/Qwen2.5-0.5B-Instruct">Qwen2.5-0.5B (日本語対応・約400MB)</option>
        <option value="onnx-community/SmolLM2-135M-Instruct-ONNX-MHA">SmolLM2-135M (超高速軽量・約100MB)</option>
      </select>
      <button id="load-btn">モデル切替</button>
    </div>
  </header>

  <div id="progress-container">
    <div id="progress-header">
      <span id="progress-text">モデル準備中...</span>
      <span id="progress-percent">0%</span>
    </div>
    <div class="bar-bg">
      <div id="bar-fill"></div>
    </div>
  </div>

  <div id="chat-box"></div>

  <form id="input-area">
    <input id="user-input" type="text" placeholder="モデル読み込み完了後に送信できます..." autocomplete="off" disabled />
    <button id="send-btn" type="submit" disabled>送信</button>
  </form>

  <script type="module">
    import { pipeline, TextStreamer } from "https://jsdelivr.net";

    const modelSelect = document.getElementById("model-select");
    const loadBtn = document.getElementById("load-btn");
    const progressText = document.getElementById("progress-text");
    const progressPercent = document.getElementById("progress-percent");
    const barFill = document.getElementById("bar-fill");
    const chatBox = document.getElementById("chat-box");
    const form = document.getElementById("input-area");
    const inputEl = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");

    let generator = null;
    const fileProgress = {};
    const messages = [
      { role: "system", content: "あなたは親切で簡潔に答える日本語のAIアシスタントです。" }
    ];

    function appendMessage(role, text) {
      const div = document.createElement("div");
      div.className = `msg ${role}`;
      div.textContent = text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
      return div;
    }

    function updateProgressUI(pct, label) {
      const clamped = Math.min(100, Math.max(0, Math.round(pct)));
      barFill.style.width = `${clamped}%`;
      progressPercent.textContent = `${clamped}%`;
      if (label) progressText.textContent = label;
    }

    async function loadModel() {
      const modelId = modelSelect.value;
      loadBtn.disabled = true;
      modelSelect.disabled = true;
      inputEl.disabled = true;
      sendBtn.disabled = true;
      Object.keys(fileProgress).forEach((k) => delete fileProgress[k]);

      const device = navigator.gpu ? "webgpu" : "wasm";
      updateProgressUI(2, `接続中 (${device.toUpperCase()}モード)...`);

      try {
        generator = await pipeline("text-generation", modelId, {
          dtype: "q4",
          device,
          progress_callback: (info) => {
            if (info.status === "progress" && info.file) {
              const p = typeof info.progress === "number"
                ? info.progress
                : (info.total ? (info.loaded / info.total) * 100 : 0);
              fileProgress[info.file] = p;
              const values = Object.values(fileProgress);
              const avg = values.reduce((a, b) => a + b, 0) / values.length;
              updateProgressUI(avg, `ダウンロード中: ${info.file}`);
            } else if (info.status === "done" && info.file) {
              fileProgress[info.file] = 100;
            } else if (info.status === "ready") {
              updateProgressUI(100, `準備完了 (${device.toUpperCase()})`);
            }
          },
        });

        updateProgressUI(100, `準備完了 (${device.toUpperCase()})`);
        inputEl.disabled = false;
        sendBtn.disabled = false;
        loadBtn.disabled = false;
        modelSelect.disabled = false;
        inputEl.placeholder = "メッセージを入力...";
        appendMessage("assistant", `準備完了しました（${device.toUpperCase()}で動作中）。何でも話しかけてみてください！`);
      } catch (err) {
        updateProgressUI(0, `エラー: ${err.message}`);
        loadBtn.disabled = false;
        modelSelect.disabled = false;
      }
    }

    loadBtn.addEventListener("click", loadModel);

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = inputEl.value.trim();
      if (!text || !generator) return;

      inputEl.value = "";
      inputEl.disabled = true;
      sendBtn.disabled = true;

      appendMessage("user", text);
      messages.push({ role: "user", content: text });

      const aiBubble = appendMessage("assistant", "");
      aiBubble.classList.add("cursor");
      let currentReply = "";

      const streamer = new TextStreamer(generator.tokenizer, {
        skip_prompt: true,
        skip_special_tokens: true,
        callback_function: (tokenText) => {
          currentReply += tokenText;
          aiBubble.textContent = currentReply;
          chatBox.scrollTop = chatBox.scrollHeight;
        },
      });

      try {
        const output = await generator(messages, {
          max_new_tokens: 256,
          temperature: 0.7,
          do_sample: true,
          streamer,
        });
        messages.push({ role: "assistant", content: output.generated_text.at(-1).content });
      } catch (err) {
        aiBubble.textContent = "エラー: " + err.message;
      } finally {
        aiBubble.classList.remove("cursor");
        inputEl.disabled = false;
        sendBtn.disabled = false;
        inputEl.focus();
      }
    });

    loadModel();
  </script>
</body>
</html>
