<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Browser Transformer LLM Studio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0b1120;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      padding: 12px 20px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: space-between;
      align-items: center;
    }
    .title-group h1 { font-size: 1.05rem; margin-bottom: 4px; }
    #spec-badge {
      font-size: 0.78rem;
      color: #94a3b8;
      background: #0f172a;
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid #334155;
      display: inline-block;
    }
    #spec-badge strong { color: #38bdf8; }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    select, button {
      padding: 7px 12px;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 0.85rem;
      cursor: pointer;
    }
    select { max-width: 340px; }
    #load-btn { background: #2563eb; border: none; font-weight: bold; }
    #reset-btn { background: #334155; border: none; }
    button:disabled, select:disabled { opacity: 0.5; cursor: not-allowed; }
    #progress-container {
      width: 100%;
      background: #1e293b;
      padding: 10px 20px;
      border-bottom: 1px solid #334155;
    }
    #progress-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.82rem;
      color: #38bdf8;
      margin-bottom: 5px;
    }
    .bar-bg {
      width: 100%;
      height: 10px;
      background: #0f172a;
      border-radius: 5px;
      overflow: hidden;
      border: 1px solid #475569;
    }
    #bar-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #2563eb, #38bdf8);
      transition: width 0.2s ease;
    }
    #chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      max-width: 78%;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .user { align-self: flex-end; background: #2563eb; color: #fff; }
    .assistant { align-self: flex-start; background: #1e293b; border: 1px solid #334155; }
    .system-note {
      align-self: center;
      background: #0f172a;
      border: 1px solid #334155;
      color: #94a3b8;
      font-size: 0.82rem;
      padding: 8px 14px;
      border-radius: 8px;
      text-align: center;
    }
    .cursor::after {
      content: "▋";
      animation: blink 0.8s infinite;
      margin-left: 2px;
      color: #38bdf8;
    }
    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }
    #input-area {
      display: flex;
      gap: 10px;
      padding: 14px 20px;
      background: #1e293b;
      border-top: 1px solid #334155;
    }
    #user-input {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 1rem;
    }
    #send-btn {
      padding: 0 22px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }
    #stop-btn {
      padding: 0 18px;
      border: none;
      border-radius: 8px;
      background: #dc2626;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      display: none;
    }
  </style>
</head>
<body>
  <header>
    <div class="title-group">
      <h1>Browser Transformer LLM（Web Worker非同期実行）</h1>
      <div id="spec-badge">端末スペックを診断中...</div>
    </div>
    <div class="controls">
      <select id="model-select"></select>
      <button id="load-btn">読込</button>
      <button id="reset-btn">履歴消去</button>
    </div>
  </header>

  <div id="progress-container">
    <div id="progress-header">
      <span id="progress-text">準備中...</span>
      <span id="progress-percent">0%</span>
    </div>
    <div class="bar-bg">
      <div id="bar-fill"></div>
    </div>
  </div>

  <div id="chat-box"></div>

  <form id="input-area">
    <input id="user-input" type="text" placeholder="モデル読み込み完了後に送信できます..." autocomplete="off" disabled />
    <button id="send-btn" type="submit" disabled>送信</button>
    <button id="stop-btn" type="button">停止</button>
  </form>

  <script id="worker-code" type="javascript/worker">
    import { pipeline, TextStreamer, InterruptableStoppingCriteria } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.4.1";

    let generator = null;
    const stoppingCriteria = new InterruptableStoppingCriteria();
    const fileProgress = {};

    self.onmessage = async (e) => {
      const { type, payload } = e.data;

      if (type === "load") {
        const { modelId, device } = payload;
        Object.keys(fileProgress).forEach((k) => delete fileProgress[k]);

        try {
          if (generator && typeof generator.dispose === "function") {
            await generator.dispose();
            generator = null;
          }

          generator = await pipeline("text-generation", modelId, {
            dtype: "q4",
            device,
            progress_callback: (info) => {
              if (info.status === "progress" && info.file) {
                const p = typeof info.progress === "number"
                  ? info.progress
                  : (info.total ? (info.loaded / info.total) * 100 : 0);
                fileProgress[info.file] = p;
                const vals = Object.values(fileProgress);
                const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
                self.postMessage({ type: "progress", progress: avg, text: `ダウンロード中: ${info.file}` });
              } else if (info.status === "done" && info.file) {
                fileProgress[info.file] = 100;
              } else if (info.status === "initiate") {
                self.postMessage({ type: "progress", progress: 5, text: `初期化中: ${info.file || ""}` });
              }
            },
          });

          self.postMessage({ type: "ready" });
        } catch (err) {
          self.postMessage({ type: "error", error: err.message });
        }
      }

      if (type === "generate") {
        if (!generator) return;
        stoppingCriteria.reset();

        const streamer = new TextStreamer(generator.tokenizer, {
          skip_prompt: true,
          skip_special_tokens: true,
          callback_function: (token) => {
            self.postMessage({ type: "token", token });
          },
        });

        try {
          const output = await generator(payload.messages, {
            max_new_tokens: 512,
            temperature: 0.7,
            do_sample: true,
            streamer,
            stopping_criteria: [stoppingCriteria],
          });
          self.postMessage({ type: "done", reply: output.generated_text.at(-1).content });
        } catch (err) {
          self.postMessage({ type: "error", error: err.message });
        }
      }

      if (type === "stop") {
        stoppingCriteria.interrupt();
      }
    };
  </script>

  <script type="module">
    const MODELS = [
      { id: "onnx-community/SmolLM2-135M-Instruct-ONNX-MHA", name: "SmolLM2-135M", size: "約100MB", tier: 1, desc: "超高速・英語中心" },
      { id: "onnx-community/Qwen2.5-0.5B-Instruct", name: "Qwen2.5-0.5B", size: "約400MB", tier: 1, desc: "軽量・日本語対応" },
      { id: "onnx-community/Llama-3.2-1B-Instruct-q4f16", name: "Llama-3.2-1B", size: "約800MB", tier: 2, desc: "中量・多言語バランス" },
      { id: "onnx-community/Qwen2.5-1.5B-Instruct", name: "Qwen2.5-1.5B", size: "約1.1GB", tier: 2, desc: "中重量・日本語高精度" },
      { id: "onnx-community/Qwen2.5-3B-Instruct", name: "Qwen2.5-3B", size: "約2.0GB", tier: 3, desc: "重量級・高度な推論と日本語" },
      { id: "onnx-community/Phi-3.5-mini-instruct-onnx-web", name: "Phi-3.5-mini (3.8B)", size: "約2.3GB", tier: 3, desc: "超重量級・論理思考特化" }
    ];

    const specBadge = document.getElementById("spec-badge");
    const modelSelect = document.getElementById("model-select");
    const loadBtn = document.getElementById("load-btn");
    const resetBtn = document.getElementById("reset-btn");
    const progressText = document.getElementById("progress-text");
    const progressPercent = document.getElementById("progress-percent");
    const barFill = document.getElementById("bar-fill");
    const chatBox = document.getElementById("chat-box");
    const form = document.getElementById("input-area");
    const inputEl = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");
    const stopBtn = document.getElementById("stop-btn");

    const workerBlob = new Blob([document.getElementById("worker-code").textContent], { type: "application/javascript" });
    const worker = new Worker(URL.createObjectURL(workerBlob), { type: "module" });

    let deviceType = "wasm";
    let recommendedTier = 1;
    let currentAiBubble = null;
    let currentReply = "";
    let messages = [
      { role: "system", content: "あなたは親切で論理的に答える日本語のAIアシスタントです。" }
    ];

    function appendMessage(role, text) {
      const div = document.createElement("div");
      div.className = `msg ${role}`;
      div.textContent = text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
      return div;
    }

    function updateProgressUI(pct, label) {
      const clamped = Math.min(100, Math.max(0, Math.round(pct)));
      barFill.style.width = `${clamped}%`;
      progressPercent.textContent = `${clamped}%`;
      if (label) progressText.textContent = label;
    }

    async function detectDeviceAndSetupModels() {
      const ram = navigator.deviceMemory || 4;
      const cores = navigator.hardwareConcurrency || 4;
      let gpuInfo = "非対応 (CPU/Wasm動作)";

      if (navigator.gpu) {
        try {
          const adapter = await navigator.gpu.requestAdapter();
          if (adapter) {
            deviceType = "webgpu";
            const info = adapter.info || {};
            gpuInfo = info.architecture ? `WebGPU有効 (${info.architecture})` : "WebGPU有効 (GPU加速)";
          }
        } catch (_) {}
      }

      if (deviceType === "webgpu" && ram >= 8) {
        recommendedTier = 3;
      } else if (deviceType === "webgpu" || ram >= 8) {
        recommendedTier = 2;
      } else {
        recommendedTier = 1;
      }

      const capabilityText =
        recommendedTier === 3 ? "重量級(3B〜3.8B)まで快適動作" :
        recommendedTier === 2 ? "中重量(1.5B)まで動作可能" :
        "軽量(0.5B以下)を推奨";

      specBadge.innerHTML = `環境: <strong>${gpuInfo}</strong> / RAM目安: <strong>${ram}GB</strong> / コア: <strong>${cores}</strong> → 判定: <strong>${capabilityText}</strong>`;

      let defaultIndex = 1;
      MODELS.forEach((m, idx) => {
        const opt = document.createElement("option");
        opt.value = m.id;
        const isRec = m.tier === recommendedTier;
        const badge = isRec ? "【★端末推奨】" : (m.tier > recommendedTier ? "【⚠️高負荷】" : "");
        opt.textContent = `${badge}${m.name} (${m.size} / ${m.desc})`;
        modelSelect.appendChild(opt);
        if (isRec) defaultIndex = idx;
      });
      modelSelect.selectedIndex = defaultIndex;
    }

    function startLoadModel() {
      const modelId = modelSelect.value;
      const modelLabel = modelSelect.options[modelSelect.selectedIndex].text;
      loadBtn.disabled = true;
      modelSelect.disabled = true;
      inputEl.disabled = true;
      sendBtn.disabled = true;

      updateProgressUI(2, `別スレッドで読込開始: ${modelLabel}`);
      worker.postMessage({ type: "load", payload: { modelId, device: deviceType } });
    }

    worker.onmessage = (e) => {
      const { type, progress, text, token, reply, error } = e.data;

      if (type === "progress") {
        updateProgressUI(progress, text);
      } else if (type === "ready") {
        const modelLabel = modelSelect.options[modelSelect.selectedIndex].text;
        updateProgressUI(100, `準備完了（Web Worker + ${deviceType.toUpperCase()}稼働中）`);
        loadBtn.disabled = false;
        modelSelect.disabled = false;
        inputEl.disabled = false;
        sendBtn.disabled = false;
        inputEl.placeholder = "メッセージを入力...";
        appendMessage("system-note", `「${modelLabel}」の準備が完了しました。画面はフリーズせず快適に操作できます。`);
      } else if (type === "token") {
        if (currentAiBubble) {
          currentReply += token;
          currentAiBubble.textContent = currentReply;
          chatBox.scrollTop = chatBox.scrollHeight;
        }
      } else if (type === "done") {
        if (currentAiBubble) {
          currentAiBubble.classList.remove("cursor");
          currentAiBubble.textContent = reply || currentReply;
        }
        messages.push({ role: "assistant", content: reply || currentReply });
        setGeneratingState(false);
      } else if (type === "error") {
        updateProgressUI(0, `エラー: ${error}`);
        appendMessage("system-note", `エラーが発生しました: ${error}
※メモリ不足の場合は、より軽量なモデルを選択してください。`);
        loadBtn.disabled = false;
        modelSelect.disabled = false;
        setGeneratingState(false);
      }
    };

    function setGeneratingState(isGenerating) {
      inputEl.disabled = isGenerating;
      sendBtn.style.display = isGenerating ? "none" : "inline-block";
      stopBtn.style.display = isGenerating ? "inline-block" : "none";
      loadBtn.disabled = isGenerating;
      modelSelect.disabled = isGenerating;
      if (!isGenerating) inputEl.focus();
    }

    loadBtn.addEventListener("click", startLoadModel);
    modelSelect.addEventListener("change", startLoadModel);

    resetBtn.addEventListener("click", () => {
      messages = [{ role: "system", content: "あなたは親切で論理的に答える日本語のAIアシスタントです。" }];
      chatBox.innerHTML = "";
      appendMessage("system-note", "会話履歴をリセットしました。");
    });

    stopBtn.addEventListener("click", () => {
      worker.postMessage({ type: "stop" });
    });

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = inputEl.value.trim();
      if (!text) return;

      inputEl.value = "";
      appendMessage("user", text);
      messages.push({ role: "user", content: text });

      currentReply = "";
      currentAiBubble = appendMessage("assistant", "");
      currentAiBubble.classList.add("cursor");
      setGeneratingState(true);

      worker.postMessage({ type: "generate", payload: { messages } });
    });

    await detectDeviceAndSetupModels();
    startLoadModel();
  </script>
</body>
</html>
